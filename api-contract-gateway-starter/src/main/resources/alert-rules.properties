# 契约网关告警规则（spec contract-async-stability：熔断打开、连接池耗尽、超时率异常、失败率异常）
# 规则集合固定四条，本文件仅覆盖阈值；缺失项回退内置默认。
# 熔断打开：累计打开次数达到下限即告警
alert.breaker-open.enabled=true
alert.breaker-open.min-count=1
# 连接池耗尽：等待队列快速失败次数达到下限即告警
alert.pool-exhausted.enabled=true
alert.pool-exhausted.min-count=1
# 失败率异常：全局错误率达到阈值即告警（design 验收 P99 超时率 < 0.1%，失败率告警线 50%）
alert.error-rate.enabled=true
alert.error-rate.threshold=0.5
# 超时率异常：整体超时占比达到阈值即告警（对齐 P99 超时率 < 0.1% 验收线）
alert.timeout-rate.enabled=true
alert.timeout-rate.threshold=0.1
